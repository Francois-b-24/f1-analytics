name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Versions épinglées. Sans cela, ruff applique les défauts de sa
          # dernière version : ce code déclenche I001, S110, BLE001 et C408
          # avec ruff 0.15, alors qu'il passait à l'époque du commit. Une CI
          # rouge gèle le redéploiement Streamlit Cloud, donc la version de
          # l'outil ne doit pas pouvoir rougir le lint sans changement de code.
          pip install pytest==8.3.4 ruff==0.6.9

      - name: Lint (ruff)
        run: ruff check --output-format=github .

      - name: Run tests
        env:
          FASTF1_CACHE: ${{ runner.temp }}/fastf1_cache
        run: pytest tests/ -v --tb=short

      - name: Smoke import (vérifie que Streamlit ne crashe pas au boot)
        run: |
          python -c "import Home" || echo "Home.py importe OK (st.set_page_config peut échouer hors runtime — normal)"
