name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  # Job bloquant : il conditionne le redéploiement Streamlit Cloud, donc il ne
  # doit dépendre de rien d'extérieur — en particulier pas du réseau OpenF1.
  qualite:
    name: Lint et tests hors ligne (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.11 est la version de runtime.txt (celle de la production).
        # 3.12 anticipe une montée de version.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Versions épinglées, identiques à pyproject.toml et au pre-commit :
          # une release d'outil ne doit pas rougir la CI sans changement de
          # code, car un lint rouge gèle le redéploiement.
          pip install pytest==8.3.4 pytest-cov==6.0.0 ruff==0.15.22

      - name: Lint (ruff)
        run: ruff check --output-format=github .

      - name: Tests hors ligne
        env:
          FASTF1_CACHE: ${{ runner.temp }}/fastf1_cache
        run: pytest -m "not reseau" -v --tb=short --cov=src --cov-report=term-missing

      # Un import réussi ne suffit pas : la panne « Error running app » vécue en
      # production venait du rendu. Ces tests exécutent réellement chaque point
      # d'entrée — y compris Home.py, que Streamlit Cloud référence encore.
      - name: Démarrage des points d'entrée
        run: pytest tests/test_points_entree.py -v

  # Job non bloquant : il interroge la vraie API. Une panne d'OpenF1 ne doit
  # pas rougir la CI et figer la production, mais on veut quand même savoir si
  # le contrat de données a changé.
  contrat-openf1:
    name: Contrat de l'API OpenF1 (informatif)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==8.3.4

      - name: Tests réseau
        env:
          FASTF1_CACHE: ${{ runner.temp }}/fastf1_cache
        run: pytest -m reseau -v --tb=short
