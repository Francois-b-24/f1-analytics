name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Versions épinglées : une release de ruff ne doit pas rougir la CI
          # sans changement de code — ce qui gèlerait le redéploiement.
          pip install pytest==8.3.4 ruff==0.15.22

      - name: Lint (ruff)
        run: ruff check --output-format=github .

      - name: Run tests
        env:
          FASTF1_CACHE: ${{ runner.temp }}/fastf1_cache
        run: pytest tests/ -v --tb=short

      # Un simple import ne suffit pas : la panne « Error running app » vécue en
      # production venait du rendu, pas de l'import. Les tests de
      # tests/test_points_entree.py exécutent réellement chaque point d'entrée.
      - name: Démarrage des points d'entrée
        run: pytest tests/test_points_entree.py -v
