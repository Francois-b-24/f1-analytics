name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Versions épinglées : sans cela la CI installe le dernier ruff, dont
          # les règles par défaut se sont élargies — ce code y déclenche
          # 81 erreurs alors qu'il passait à l'époque du commit. Une CI rouge
          # gèle le redéploiement Streamlit Cloud, donc la version de l'outil
          # ne doit pas pouvoir rougir le lint sans changement de code.
          pip install pytest==8.3.4 ruff==0.6.9

      - name: Lint (ruff)
        run: ruff check --output-format=github .

      - name: Run tests
        env:
          FASTF1_CACHE: ${{ runner.temp }}/fastf1_cache
        run: pytest tests/ -v --tb=short

      # Le smoke import d'avant se terminait par `|| echo`, qui avalait toute
      # erreur — y compris une SyntaxError. Il ne pouvait donc pas échouer, et
      # n'a jamais rien protégé. `tests/test_rendu_pages.py` le remplace : il
      # monte réellement les deux points d'entrée et les dix pages via
      # AppTest, hors ligne, et il est couvert par le gate pytest ci-dessus.
