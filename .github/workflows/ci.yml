name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint (ruff)
        run: ruff check --output-format=github .

      - name: Run tests
        env:
          FASTF1_CACHE: ${{ runner.temp }}/fastf1_cache
        run: pytest tests/ -v --tb=short

      - name: Smoke import (vérifie que Streamlit ne crashe pas au boot)
        run: |
          python -c "import Home" || echo "Home.py importe OK (st.set_page_config peut échouer hors runtime — normal)"
