[server]
headless = true
# CORS et XSRF sont laissés activés (valeur par défaut des deux options).
# Ne pas remettre enableCORS = false : combiné à enableXsrfProtection = true,
# Streamlit réactive silencieusement les deux, donc la ligne n'aurait aucun
# effet tout en laissant croire que CORS est désactivé.
enableXsrfProtection = true
maxUploadSize = 50
maxMessageSize = 200

[browser]
gatherUsageStats = false

[logger]
level = "info"
messageFormat = "%(asctime)s [%(levelname)s] %(name)s: %(message)s"

# Theme cohérent avec f1_theme.css — palette claire.
# Gouverne les widgets que le CSS n'atteint pas (menus déroulants, curseurs).
[theme]
base = "light"
primaryColor = "#c1322d"                 # rouge Ferrari — identité conservée
backgroundColor = "#f7f8fa"              # gris très clair, légèrement froid
secondaryBackgroundColor = "#ffffff"     # surface (cartes, sidebar)
textColor = "#111418"                    # encre principale
font = "sans serif"
