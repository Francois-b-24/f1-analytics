[server]
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 50
maxMessageSize = 200

[browser]
gatherUsageStats = false

[logger]
level = "info"
messageFormat = "%(asctime)s [%(levelname)s] %(name)s: %(message)s"

# Theme cohérent avec f1_theme.css — palette sombre sophistiquée
[theme]
base = "dark"
primaryColor = "#c1322d"                 # rouge Ferrari désaturé
backgroundColor = "#0d1117"              # anthracite profond
secondaryBackgroundColor = "#161b22"     # surface (cartes, sidebar)
textColor = "#e6edf3"                    # blanc cassé doux
font = "sans serif"
