[project]
name = "formula1"
version = "0.1.0"
description = "Statistiques interactives sur la Formule 1."
requires-python = ">=3.10"
dependencies = [
    "streamlit",
    "fastf1>=3.8.3",
    "pandas",
    "matplotlib",
    "plotly",
    "streamlit-extras",
    "numpy>=2.0.2",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# Streamlit impose que st.set_page_config() soit la première commande st.*
# exécutée : certains imports doivent donc suivre l'appel de configuration.
"Home.py" = ["E402"]
"pages/*.py" = ["E402"]

[tool.pytest.ini_options]
# Ajoute la racine du repo au sys.path pour que `from src...` fonctionne
# depuis tests/ sans dépendre du cwd.
pythonpath = ["."]
testpaths = ["tests"]
